<script src="common.js"></script>
<script>
renderProgress();
(function(){ var msg=document.getElementById("msg"),reflect=document.getElementById("reflect"),pop=document.getElementById("xsspop"),xm=document.getElementById("xssmsg");
function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var XSS=/<script\b|on(error|load|mouseover|click|focus)\s*=|<svg\b|<img\b[\s\S]*on\w+|<iframe\b|javascript:/i;
function pm(v){var m=v.match(/alert\s*\(\s*(['\"])([\s\S]*?)\1\s*\)/i);if(m)return esc(m[2]);if(/document\.cookie/i.test(v))return "PHPSESSID=9b2c4f1a7e; security=low";return "XSS";}
document.getElementById("go").onclick=function(){var v=msg.value;reflect.textContent=v;if(XSS.test(v)){xm.textContent=pm(v);pop.classList.add("show");}};
document.getElementById("xssok").onclick=function(){pop.classList.remove("show");markSolved();}; })();
</script>
